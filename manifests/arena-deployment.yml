apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrox-arena
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vibrox-arena
  template:
    metadata:
      labels:
        app: vibrox-arena
    spec:
      containers:
        - name: vibrox-arena
          image: viburoshin25/vibrox-arena:latest
          imagePullPolicy: Always
          env:
            - name: GRPC_LISTEN_ADDR
              value: ":8100"
            - name: HEALTH_LISTEN_ADDR
              value: ":8054"
          ports:
            - name: grpc
              containerPort: 8100
            - name: health
              containerPort: 8054
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
