services:
  logger:
    build: ./vibrox-echo
    ports:
      - "9000:9000"
    networks:
      - app-network
    dns:
      - 172.30.0.53
    depends_on:
      dns:
        condition: service_healthy
    volumes:
      - ./vibrox-echo/logs:/app/logs

  web:
    build: ./vibrox-web
    ports:
      - "3000:8080"
    depends_on:
      app:
        condition: service_started
      dns:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      - app-network
    dns:
      - 172.30.0.53

  dns:
    build: ./vibrox-dns
    ports:
      - "127.0.0.1:2053:2053/udp"
      - "127.0.0.1:2053:2053/tcp"
      - "127.0.0.1:8053:8053"
    environment:
      - DNS_LISTEN_ADDR=:2053
      # Preserve Docker service discovery while routing every query through
      # vibrox-dns. Docker's embedded resolver also forwards public names.
      - DNS_UPSTREAM=${DNS_UPSTREAM:-127.0.0.11:53}
      - DNS_TIMEOUT=${DNS_TIMEOUT:-3s}
      - HEALTH_LISTEN_ADDR=:8053
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8053/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      app-network:
        ipv4_address: 172.30.0.53

  arena:
    build: ./vibrox-arena
    environment:
      - GRPC_LISTEN_ADDR=:8100
      - HEALTH_LISTEN_ADDR=:8054
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8054/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      - app-network
    dns:
      - 172.30.0.53
    depends_on:
      dns:
        condition: service_healthy

  app:
    build: ./vibrox-core
    ports:
      - "8080:8080"
    environment:
      - LOGGER_HOST=logger:9000
      - ARENA_HOST=arena:8100
    depends_on:
      dns:
        condition: service_healthy
      logger:
        condition: service_started
      arena:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - vibrox-core
    dns:
      - 172.30.0.53

networks:
  app-network:
    ipam:
      config:
        - subnet: 172.30.0.0/24
