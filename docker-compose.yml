services:
  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=server
      - POSTGRES_DB=postgres
    networks:
      - app-network
    dns:
      - 172.30.0.53
    depends_on:
      dns:
        condition: service_healthy
    volumes:
      - vibrox-vol:/var/lib/postgresql/data

  logger:
    build: ./vibrox-echo
    ports:
      - "9000:9000"
    networks:
      - app-network
    dns:
      - 172.30.0.53
    depends_on:
      dns:
        condition: service_healthy
    volumes:
      - ./vibrox-echo/logs:/app/logs

  web:
    build: ./vibrox-web
    ports:
      - "3000:8080"
    depends_on:
      app:
        condition: service_started
      dns:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      - app-network
    dns:
      - 172.30.0.53

  auth:
    build: ./vibrox-auth
    ports:
      - "8000:8000"
    networks:
      - app-network
    dns:
      - 172.30.0.53
    depends_on:
      dns:
        condition: service_healthy

  dns:
    build: ./vibrox-dns
    ports:
      - "127.0.0.1:2053:2053/udp"
      - "127.0.0.1:2053:2053/tcp"
      - "127.0.0.1:8053:8053"
    environment:
      - DNS_LISTEN_ADDR=:2053
      # Preserve Docker service discovery while routing every query through
      # vibrox-dns. Docker's embedded resolver also forwards public names.
      - DNS_UPSTREAM=${DNS_UPSTREAM:-127.0.0.11:53}
      - DNS_TIMEOUT=${DNS_TIMEOUT:-3s}
      - HEALTH_LISTEN_ADDR=:8053
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8053/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      app-network:
        ipv4_address: 172.30.0.53

  app:
    build: ./vibrox-core
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=server
      - DB_NAME=postgres
      - AUTH_HOST=auth:8000
      - LOGGER_HOST=logger:9000
    depends_on:
      dns:
        condition: service_healthy
      db:
        condition: service_started
      logger:
        condition: service_started
      auth:
        condition: service_started
    networks:
      app-network:
        aliases:
          - vibrox-core
    dns:
      - 172.30.0.53

networks:
  app-network:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  vibrox-vol:
    driver: local
    driver_opts:
      type: none
      device: ./vibrox-vol
      o: bind
  vibrox-echo-vol:
    driver: local
    driver_opts:
      type: none
      device: ./vibrox-echo/logs
      o: bind
